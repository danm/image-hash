name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'

    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linter
      run: pnpm run lint

    - name: Type check
      run: pnpm run typecheck

    - name: Run tests
      run: pnpm test

    - name: Build
      run: pnpm run build

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write # push the version bump commit and tag
      id-token: write # authenticate with npm through trusted publishing

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Actions"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm test

    - name: Version bump
      run: pnpm version patch

    - name: Build
      run: pnpm run build

    # Authenticates with npm trusted publishing (OIDC), so no npm token is needed.
    # npm adds a provenance attestation automatically.
    - name: Publish to npm
      run: pnpm publish --no-git-checks

    - name: Push version changes
      run: |
        git push origin master
        git push origin --tags
